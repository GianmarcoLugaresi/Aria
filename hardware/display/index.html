<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aria · display</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  canvas{display:block;width:100vw;height:100vh}      /* niente sfondo sul canvas: il filtro del logo lavora sull'alfa; il nero e' della pagina */
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../../app/Resources/neural.js"></script>
<script>
/* Display dell'oggetto fisico: la stessa nuvola di neuroni dell'app, su sfondo nero (si riflette nel disco semiriflettente).
   Parametri URL:  ?ws=ws://127.0.0.1:8765   &demo=1 (stati finti)   &nodes=20 (numero di sfere)   &ghost=0 (sfere un po' più piccole) */
const Q = new URLSearchParams(location.search);
const DEMO = Q.get('demo') === '1';
const brain = new NeuralBrain(document.getElementById('c'), {ghost: Q.get('ghost') !== '0', nodes: +(Q.get('nodes') || 20)});

function connect() {
  if (DEMO) return;
  const ws = new WebSocket(Q.get('ws') || `ws://${location.hostname || '127.0.0.1'}:8765`);
  ws.onmessage = e => { try { const m = JSON.parse(e.data); if (m.state) brain.setState(m.state); if (m.level !== undefined) brain.setLevel(+m.level); } catch (_) {} };
  ws.onclose = () => setTimeout(connect, 1000);
  ws.onerror = () => ws.close();
}
connect();

const CYCLE = [['idle', 3], ['listening', 5], ['thinking', 2.5], ['speaking', 9]];
function syl(t, r, o) { const s = Math.pow(Math.abs(Math.sin(t * r + o)), 1.5), w = .5 + .5 * Math.sin(t * 1.3 + o * 2); return Math.min(1, s * (w > .25 ? 1 : .12) * (.65 + .35 * Math.sin(t * .7 + o))); }
let st = 'idle', st0 = 0;
function demo(t) {
  const total = CYCLE.reduce((a, c) => a + c[1], 0), x = t % total;
  let acc = 0, s = 'idle'; for (const [n, d] of CYCLE) { acc += d; if (x < acc) { s = n; break; } }
  if (s !== st) { st = s; st0 = t; brain.setState(s); }
  brain.setLevel(s === 'idle' || s === 'thinking' ? 0 : syl(t, s === 'speaking' ? 6.2 : 5.5, 1.1) * (s === 'speaking' && ((t - st0) % 3.2) > 2.7 ? 0 : 1));
}
const t0 = performance.now();
(function loop(now) { const t = (now - t0) / 1000; if (DEMO) demo(t); brain.draw(t); requestAnimationFrame(loop); })(t0);
</script>
</body>
</html>
